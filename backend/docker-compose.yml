version: '3.8'

services:
  zeiterfassung:
    build: .
    container_name: zeiterfassung-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      # Optional: API-Key für Authentifizierung setzen
      # API_KEY: dein-geheimer-key
      NODE_ENV: production
      DATA_DIR: /app/data
    # Nur über Tailscale erreichbar - kein externes Binding nötig
    # Bei Bedarf: network_mode: host
